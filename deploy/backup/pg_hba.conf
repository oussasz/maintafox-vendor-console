# Client authentication for the maintafox Postgres container (docker-compose.yml passes
# -c hba_file=/mfx-backup/pg_hba.conf). Same rules as the postgres:16 image writes at initdb,
# plus one line: the backup container takes base backups over the replication protocol
# (pg_basebackup), which "host all ..." does not cover.
# TYPE  DATABASE     USER  ADDRESS        METHOD
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  all   127.0.0.1/32   trust
host    replication  all   ::1/128        trust
host    all          all   all            scram-sha-256
host    replication  all   all            scram-sha-256
