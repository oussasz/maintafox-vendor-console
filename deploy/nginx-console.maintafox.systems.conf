# TLS certificates: use certbot or your CA; this block assumes files on disk.
# Place built assets from `pnpm build` (dist/) at /var/www/maintafox-vendor-console

server {
    listen 80;
    listen [::]:80;
    server_name console.maintafox.systems;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.maintafox.systems;

    # ssl_certificate /etc/letsencrypt/live/console.maintafox.systems/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/console.maintafox.systems/privkey.pem;

    root /var/www/maintafox-vendor-console;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
