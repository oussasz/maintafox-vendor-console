# Install on the HOST (outside Docker) for TLS termination and reverse proxy to the container.
# Assumes Docker maps vendor console to 127.0.0.1:8080 (see VENDOR_CONSOLE_PORT=8080).
#
#   sudo cp deploy/host-nginx-console.maintafox.systems.conf /etc/nginx/sites-available/console.maintafox.systems
#   sudo ln -sf /etc/nginx/sites-available/console.maintafox.systems /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d console.maintafox.systems
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name console.maintafox.systems;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.maintafox.systems;

    # After certbot:
    # ssl_certificate /etc/letsencrypt/live/console.maintafox.systems/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/console.maintafox.systems/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
