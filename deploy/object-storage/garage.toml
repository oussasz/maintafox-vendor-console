# Garage (S3-compatible object store for tenant media), single node, one copy of the data.
# Decision and alternatives: docs/deploy/OBJECT_STORAGE_DECISION.md. Operations: deploy/OBJECT_STORAGE.md.
# Reference: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/ (v2.4.1)
#
# No secret in this file: rpc_secret comes from GARAGE_RPC_SECRET (.env). The access key, secret
# key and bucket come from GARAGE_DEFAULT_ACCESS_KEY / _SECRET_KEY / _BUCKET (set from S3_ACCESS_KEY,
# S3_SECRET_KEY, S3_BUCKET in docker-compose.yml) and are created by `--single-node --default-bucket`
# on first start; on every later start Garage checks they still match and refuses to start if not.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# SQLite, not LMDB: LMDB can be corrupted by an unclean shutdown and is only recommended with
# replication (replication_factor >= 2), which a single server does not have.
db_engine = "sqlite"
# The two most recent snapshots of the metadata database are kept next to it (recovery after
# corruption, see the Garage "Recovering from failures" page).
metadata_auto_snapshot_interval = "6h"
# One server, one copy: write metadata and data blocks to disk before answering (slower writes,
# no silent loss on a power cut). Media traffic is small; durability matters more.
metadata_fsync = true
data_fsync = true

replication_factor = 1

# Cluster RPC: only this node talks to itself (the `garage` CLI inside the container). Not exposed.
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must equal S3_REGION in .env: requests signed for another region are refused
# (AuthorizationHeaderMalformed), which object-store-check reports before the API starts.
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
# No root_domain: path-style only (http://object-store:3900/<bucket>/<key>), as the API uses.

# No [s3_web] (no website hosting) and no [admin] (no admin HTTP API): nothing else listens.
