# CI only: the public media route of deploy/nginx-edge.conf without TLS, in front of the CI Garage
# (deploy/object-storage/ci-start-garage.sh, 127.0.0.1:3900). The rules are the production file
# deploy/nginx-media-proxy.conf, mounted unchanged. Started by ci-start-media-proxy.sh.

upstream object_store_upstream {
    server 127.0.0.1:3900;
}

server {
    listen 127.0.0.1:3980;
    server_name _;

    include /etc/nginx/snippets/media-proxy.conf;
}
