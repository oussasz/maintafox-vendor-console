# Public route to the tenant media object store (Garage), included inside a `server` block:
#   production: the media.maintafox.systems server in deploy/nginx-edge.conf (TLS, edge container);
#   CI:         deploy/object-storage/ci-media-proxy.nginx.conf (same rules, tested end to end by
#               api/scripts/media-presign.integration.mjs and support-bundles.integration.mjs).
# The including file defines `upstream object_store_upstream`.
#
# Only presigned URLs pass. The API signs them for S3_PUBLIC_ENDPOINT (api/src/storage/
# object-store.ts); desktops PUT media and diagnostic bundles and GET media and update installers,
# the console GETs bundles, the release workflow PUTs installers. Nothing else of the S3 API is
# reachable from outside: no credentialed requests (header signatures), no bucket listing, no other
# methods.

# A presigned URL always carries its algorithm and signature in the query string.
if ($args !~ "(^|&)X-Amz-Algorithm=AWS4-HMAC-SHA256(&|$)") {
    return 403;
}
if ($args !~ "(^|&)X-Amz-Signature=") {
    return 403;
}
# nginx picks the location from the normalised path but forwards the raw one, and the store keeps
# keys exactly as sent. A path with "//", a "." or ".." segment, or an encoded "/", "." or "\" could
# therefore be routed as one key and stored as another (e.g. a media key reaching the release
# location below). The API never signs such a key; refuse it outright.
if ($request_uri ~* "^[^?]*(//|/\.\.?(/|\?|$)|%2f|%2e|%5c)") {
    return 400;
}

# Bucket-level requests (listing, ?cors, ?acl, ?website ...; "/" lists buckets) have no object key.
# The API never presigns one, so even a URL presigned with a leaked store key cannot list here.
location ~ ^/[^/]*/?$ {
    return 403;
}

location / {
    # GET also allows HEAD. Everything else (POST, DELETE, multipart uploads ...) is refused.
    limit_except GET PUT {
        deny all;
    }

    proxy_pass http://object_store_upstream;
    proxy_http_version 1.1;
    # SigV4 signs the Host header the client sent (host, plus the port when it is not the default
    # one). The store must receive it exactly, or every URL is refused (SignatureDoesNotMatch).
    # $http_host is that header unchanged; $host would drop a non-default port.
    proxy_set_header Host $http_host;
    # A request signed in the Authorization header (a leaked store key) must not work from outside,
    # even with an X-Amz-Signature added to the query: the store only ever sees presigned requests.
    proxy_set_header Authorization "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream bodies both ways instead of spooling them to the edge container's disk.
    proxy_request_buffering off;
    proxy_buffering off;
    # Largest single object a client may upload. The desktop's largest synced file is 25 MB (work
    # order attachments, library documents); diagnostic bundles are at most 5 MiB
    # (DIAGNOSTIC_BUNDLE_MAX_BYTES, api/src/routes/support.ts). Raise this before any desktop limit.
    client_max_body_size 32m;
    # A presigned URL lives 15 minutes (PRESIGNED_URL_TTL_SECONDS); a slow site link may need minutes
    # for one file.
    client_body_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    send_timeout 900s;

    # Release uploads (api/src/routes/release-catalog.ts: <bucket>/<DEPLOYMENT_ENV>/releases/...):
    # signed installers up to RELEASE_ARTIFACT_MAX_BYTES (1 GiB), PUT only by the release workflow
    # with its own presigned URL. The signature binds the key, and the API signs desktop URLs only
    # for <env>/media/<tenant>/... keys without "." or ".." segments (with the raw-path check above,
    # no desktop URL can land here). Everything else (headers incl. the cleared Authorization,
    # buffering, timeouts) is inherited from `location /`.
    location ~ ^/[^/]+/[a-z0-9-]+/releases/ {
        limit_except GET PUT {
            deny all;
        }
        proxy_pass http://object_store_upstream;
        client_max_body_size 1025m;
    }
}
