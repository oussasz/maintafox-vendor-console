# Full stack: edge (nginx) + vendor console SPA + control API (JWT).
# Postgres holds all control-API data (DATABASE_URL); MinIO holds TenantMedia (S3_*).
#
# DNS: console.maintafox.systems and api.maintafox.systems → this server's public IP.
# First deploy: copy .env.example to .env and set JWT_SECRET + SEED_ADMIN_PASSWORD.
# TLS: issue certs on the host (certbot) and mount /etc/letsencrypt into edge (see deploy/VPS-COMMANDS.md).
#
# Memory caps are soft safety bounds for a ~4 GiB VPS — well above normal RSS so they
# do not affect healthy operation; they only stop a runaway process from filling the host.

services:
  # The WAL archive volume is created root-owned; Postgres (user postgres) must write to it.
  pg-wal-archive-init:
    image: postgres:16-alpine
    container_name: maintafox-pg-wal-archive-init
    mem_limit: 64m
    entrypoint: ["sh", "-c", "chown postgres:postgres /wal-archive && chmod 700 /wal-archive"]
    volumes:
      - pg_wal_archive:/wal-archive

  postgres:
    image: postgres:16-alpine
    container_name: maintafox-sync-postgres
    restart: unless-stopped
    mem_limit: 512m
    # Continuous WAL archiving for point-in-time recovery (deploy/BACKUP_AND_RESTORE.md): every
    # finished WAL segment is gzip-copied to the pg_wal_archive volume; a segment is forced at least
    # every PG_WAL_ARCHIVE_TIMEOUT_SECONDS. hba_file adds replication access for pg_basebackup.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=sh /mfx-backup/wal-archive.sh "%p" "%f"
      - -c
      - archive_timeout=${PG_WAL_ARCHIVE_TIMEOUT_SECONDS:?set PG_WAL_ARCHIVE_TIMEOUT_SECONDS in .env}
      - -c
      - hba_file=/mfx-backup/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      MFX_WAL_ARCHIVE_DIR: /wal-archive
    volumes:
      - sync_postgres_data:/var/lib/postgresql/data
      - pg_wal_archive:/wal-archive
      - ./deploy/backup:/mfx-backup:ro
    depends_on:
      pg-wal-archive-init:
        condition: service_completed_successfully
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: maintafox-minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - sync_minio_data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: maintafox-minio-init
    mem_limit: 128m
    depends_on:
      - minio
    # Creates the media bucket, turns on object versioning (an overwritten or deleted object stays
    # recoverable) and expires old versions after MINIO_NONCURRENT_VERSION_RETENTION_DAYS.
    # Every step must succeed: the API does not start on a half-configured bucket.
    entrypoint: >
      /bin/sh -c "
      set -e;
      tries=0;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        tries=$$((tries + 1)); [ $$tries -lt 30 ] || exit 1; sleep 2;
      done;
      mc mb -p local/$${S3_BUCKET};
      mc version enable local/$${S3_BUCKET};
      printf '{\"Rules\":[{\"ID\":\"expire-noncurrent-versions\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"\"},\"NoncurrentVersionExpiration\":{\"NoncurrentDays\":%s}}]}' $${MINIO_NONCURRENT_VERSION_RETENTION_DAYS} | mc ilm import local/$${S3_BUCKET};
      mc version info local/$${S3_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-maintafox-tenant-media}
      MINIO_NONCURRENT_VERSION_RETENTION_DAYS: ${MINIO_NONCURRENT_VERSION_RETENTION_DAYS:?set MINIO_NONCURRENT_VERSION_RETENTION_DAYS in .env}

  api:
    image: maintafox-control-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: maintafox-control-api
    restart: unless-stopped
    mem_limit: 512m
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://console.maintafox.systems}
      DESKTOP_APP_ORIGINS: ${DESKTOP_APP_ORIGINS:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      PORT: "3000"
      ENTITLEMENT_SIGNING_KEY_ID: ${ENTITLEMENT_SIGNING_KEY_ID:?set ENTITLEMENT_SIGNING_KEY_ID in .env}
      ENTITLEMENT_SIGNING_PRIVATE_KEY: ${ENTITLEMENT_SIGNING_PRIVATE_KEY:?set ENTITLEMENT_SIGNING_PRIVATE_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      SYNC_CHECKPOINT_SECRET: ${SYNC_CHECKPOINT_SECRET:?set SYNC_CHECKPOINT_SECRET in .env}
      SYNC_INGRESS_RETENTION_DAYS: ${SYNC_INGRESS_RETENTION_DAYS:?set SYNC_INGRESS_RETENTION_DAYS in .env}
      SYNC_IDEMPOTENCY_RETENTION_DAYS: ${SYNC_IDEMPOTENCY_RETENTION_DAYS:?set SYNC_IDEMPOTENCY_RETENTION_DAYS in .env}
      SYNC_RETENTION_INTERVAL_MINUTES: ${SYNC_RETENTION_INTERVAL_MINUTES:?set SYNC_RETENTION_INTERVAL_MINUTES in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-maintafox-tenant-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-prod}
      SLICKPAY_PUBLIC_KEY: ${SLICKPAY_PUBLIC_KEY:-}
      SLICKPAY_SECRET_KEY: ${SLICKPAY_SECRET_KEY:-}
      SLICKPAY_WEBHOOK_SECRET: ${SLICKPAY_WEBHOOK_SECRET:-}
      SLICKPAY_API_BASE_URL: ${SLICKPAY_API_BASE_URL:-https://prodapi.slick-pay.com}
      SLICKPAY_WEBHOOK_URL: ${SLICKPAY_WEBHOOK_URL:-https://api.maintafox.systems/api/v1/webhooks/slickpay}
      SLICKPAY_DEFAULT_RETURN_URL: ${SLICKPAY_DEFAULT_RETURN_URL:-https://console.maintafox.systems/vendor-console/entitlements}
      SLICKPAY_EXTRA_SLOT_PRICE: ${SLICKPAY_EXTRA_SLOT_PRICE:-0}
    # Holds the legacy SQLite control-plane.db, read only by the one-shot Postgres import
    # (deploy/PHASE2_POSTGRES_CUTOVER.md). Keep it until the cutover is final.
    volumes:
      - control_api_data:/data
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Nightly pg_dump + base backup, local retention, optional encrypted off-site copy, monthly
  # restore drill (deploy/BACKUP_AND_RESTORE.md). Same image build as the API, target `backup`.
  backup:
    image: maintafox-backup:local
    pull_policy: never
    build:
      context: .
      dockerfile: api/Dockerfile
      target: backup
    container_name: maintafox-backup
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      BACKUP_DIR: /backups
      MFX_WAL_ARCHIVE_DIR: /wal-archive
      BACKUP_ENV_FILE: /run/maintafox/app.env
      BACKUP_DAILY_AT_UTC: ${BACKUP_DAILY_AT_UTC:?set BACKUP_DAILY_AT_UTC in .env}
      BACKUP_DRILL_DAY_OF_MONTH: ${BACKUP_DRILL_DAY_OF_MONTH:?set BACKUP_DRILL_DAY_OF_MONTH in .env}
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:?set BACKUP_LOCAL_RETENTION_DAYS in .env}
      BACKUP_OFFSITE_MODE: ${BACKUP_OFFSITE_MODE:?set BACKUP_OFFSITE_MODE in .env (disabled or s3)}
      # Only read when BACKUP_OFFSITE_MODE=s3; the off-site tool refuses to run if one is empty.
      BACKUP_OFFSITE_S3_ENDPOINT: ${BACKUP_OFFSITE_S3_ENDPOINT:-}
      BACKUP_OFFSITE_S3_REGION: ${BACKUP_OFFSITE_S3_REGION:-}
      BACKUP_OFFSITE_S3_BUCKET: ${BACKUP_OFFSITE_S3_BUCKET:-}
      BACKUP_OFFSITE_S3_ACCESS_KEY: ${BACKUP_OFFSITE_S3_ACCESS_KEY:-}
      BACKUP_OFFSITE_S3_SECRET_KEY: ${BACKUP_OFFSITE_S3_SECRET_KEY:-}
      BACKUP_OFFSITE_S3_PREFIX: ${BACKUP_OFFSITE_S3_PREFIX:-}
      BACKUP_OFFSITE_S3_FORCE_PATH_STYLE: ${BACKUP_OFFSITE_S3_FORCE_PATH_STYLE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Media bucket (read for the off-site media copy), same values as the api service.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-maintafox-tenant-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - backup_data:/backups
      - pg_wal_archive:/wal-archive
      # The secrets file goes off-site too (encrypted): without it a restored server cannot sign
      # licences or accept existing device tokens.
      - ./.env:/run/maintafox/app.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      # The API applies migration 006 (backup_runs) before the first run is recorded.
      api:
        condition: service_healthy

  vendor-console:
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL:-https://api.maintafox.systems}
        VITE_DEV_MOCK_AUTH: "false"
        VITE_BASE_PATH: /
    image: maintafox-vendor-console:local
    container_name: maintafox-vendor-console
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"

  edge:
    image: nginx:1.27-alpine
    container_name: maintafox-edge
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api
      - vendor-console

volumes:
  control_api_data:
  sync_postgres_data:
  sync_minio_data:
  pg_wal_archive:
  backup_data:
